# Udgiver sitet til webhotellet (Simply.com) via FTPS ved hvert push til main.
# Kræver repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Valgfri repository variable: FTP_SERVER_DIR (standard: public_html/danieldanieldaniel/)

name: Udgiv til webhotel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Tjek at FTP-oplysninger er sat op
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::error::Mangler repository secrets FTP_SERVER, FTP_USERNAME og FTP_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/danieldanieldaniel/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            README.md
